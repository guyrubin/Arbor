name: AI read-aloud source review

on:
  push:
    branches: ['codex/ai-readaloud-cost-2026-10-14']
    paths: ['.github/workflows/ai-readaloud-source-review.yml']

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package tracked source only (no runtime secrets or family data)
        run: |
          mkdir -p review-source
          git rev-parse HEAD > review-source/HEAD.txt
          git archive --format=tar HEAD app/src app/scripts app/package.json app/package-lock.json app/tsconfig.json app/vite.config.ts cloudbuild.prod.yaml docs evals .github | gzip > review-source/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ai-readaloud-review-source
          path: review-source/
          retention-days: 1
          if-no-files-found: error
