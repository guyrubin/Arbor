name: Kids unsigned native verification
on:
  push:
    branches: [codex/kids-book-integrity-2026-10-18]
    paths: ['app/**', '.github/workflows/kids-native-verify.yml']
permissions:
  contents: read
env:
  VITE_HAS_GEMINI_API: 'true'
  VITE_FIREBASE_API_KEY: AIzaSyAa0MZ87e_ofMHlBFdfCxPBSAelC0ghqvs
  VITE_FIREBASE_AUTH_DOMAIN: arborprd-westeu.firebaseapp.com
  VITE_FIREBASE_PROJECT_ID: arborprd-westeu
  VITE_FIREBASE_STORAGE_BUCKET: arborprd-westeu.firebasestorage.app
  VITE_FIREBASE_MESSAGING_SENDER_ID: '628681500167'
  VITE_FIREBASE_APP_ID: '1:628681500167:web:f78b93f5f692e174d2aca2'
jobs:
  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: npm ci
      - run: npm run build
      - run: node scripts/native-checkout-scan.mjs
      - run: npx cap sync android
      - name: Compile without release signing or publishing
        working-directory: app/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace
  ios-compile:
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -switch "$XC"; fi
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node scripts/native-checkout-scan.mjs
      - run: npx cap sync ios
      - name: Compile unsigned archive only; no TestFlight or App Store operation
        working-directory: app/ios/App
        run: |
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/KidsIntegrity.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
