name: Correct isolated read-aloud contract
on:
  push:
    branches: ['codex/ai-readaloud-cost-2026-10-14']
    paths: ['.github/workflows/readaloud-contract-fix.yml']
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed correction on this branch only
        run: |
          git fetch --depth=1 origin 2d6445e7cf220e4a0453b01cc10c04b1dbadefb3
          git diff --exit-code 2d6445e7cf220e4a0453b01cc10c04b1dbadefb3 -- app/src
          python - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              assert s.count(old) == 1, path
              p.write_text(s.replace(old, new))
          replace('app/src/lib/api.ts', 'export type AdminOverview = {\n', '''/** Server-computed list-price estimates; nullable values mean not measured. */
          export type AdminCost30d = {
            days: number;
            estimatedCostUsd: number | null;
            pricedCalls: number;
            calls: number;
            activeFamilies: number;
            perActiveFamilyUsd: number | null;
            priceTableAsOf: string;
          };

          export type AdminOverview = {
            /** Optional during a rolling client/server release; never substitute zero. */
            cost30d?: AdminCost30d;
          ''')
          replace('app/src/lib/voice.ts', 'if (naturalMisses >= NATURAL_DEGRADE_AFTER) setVoiceEngine("basic"); // degrade the session to the floor', '''// A natural-only webview has no floor to degrade to. Keep its retry control
              // available rather than making speech disappear after three failures.
              if (naturalMisses >= NATURAL_DEGRADE_AFTER && browserVoiceSupported()) setVoiceEngine("basic");''')
          marker = '  it("stopping while auth is pending prevents a paid POST",'
          replace('app/src/lib/readAloudRegression.test.ts', marker, '''  it("keeps natural-only playback retryable after three failed starts", async () => {
              vi.stubGlobal("window", {});
              setNaturalSynth((_text, handlers) => {
                queueMicrotask(() => handlers.onError?.());
                return { stop: vi.fn() };
              });
              setVoiceEngine("natural");
              for (let i = 0; i < 3; i++) {
                const onError = vi.fn();
                expect(speakText("Try speech", { onError })).toBeGreaterThan(0);
                await vi.runAllTicks();
                expect(onError).toHaveBeenCalledTimes(1);
                expect(voiceState().speaking).toBe(false);
              }
              expect(voiceState().engine).toBe("natural");
              expect(voiceSupported()).toBe(true);
            });
          ''' + marker)
          p = Path('app/src/lib/adminOverviewContract.test.ts')
          assert not p.exists()
          p.write_text('''import { describe, expect, expectTypeOf, it } from "vitest";
          import type { AdminCost30d, AdminOverview } from "./api";
          import type { Cost30d, AdminOverview as ServerOverview } from "../server/adminMetrics";

          describe("founder cost overview wire contract", () => {
            it("keeps the client cost fields identical to the server without runtime server imports", () => {
              expectTypeOf<AdminCost30d>().toEqualTypeOf<Cost30d>();
              expectTypeOf<ServerOverview>().toExtend<AdminOverview>();
            });
            it("supports a rolling release without inventing costs on older responses", () => {
              const legacy: AdminOverview = {
                users: 0, paying: { plus: 0, family: 0, trialing: 0, total: 0 },
                usageToday: { date: "2026-10-14", calls: 0, promptTokens: 0, outputTokens: 0,
                  totalTokens: 0, byProvider: {}, approxCostEur: 0 },
                generatedAt: "2026-10-14T00:00:00Z",
              };
              expect(legacy.cost30d).toBeUndefined();
            });
          });
          ''')
          PY
          git diff --check
          git add app/src/lib/api.ts app/src/lib/voice.ts app/src/lib/readAloudRegression.test.ts app/src/lib/adminOverviewContract.test.ts
          git config user.name 'Arbor candidate automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align cost API contract and retain retry on natural-only webviews'
          git push origin HEAD:refs/heads/codex/ai-readaloud-cost-2026-10-14
