name: Arbor Sneak Replay Diagnostic

# Temporary immediate evidence run; the complete sixty-cell gate stays in CI.
on:
  push:
    branches: [codex/kids-production-value-2026-11-19]
    paths:
      - .github/workflows/arbor-sneak-diagnostic.yml
      - app/scripts/kids-sneak-diagnostic.mjs
      - app/scripts/kids-maker-cycle-browser.mjs

permissions:
  contents: read

jobs:
  sneak-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Install normal Chromium
        run: npx playwright install --with-deps chromium
      - name: Build actual Kids components with synthetic adapters
        run: npx vite build --config scripts/studio-v2-preview/vite.config.ts
      - name: Operate all four Sneak replay cells
        run: node scripts/kids-sneak-diagnostic.mjs
      - name: Retain original records and screenshots on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-sneak-replay-diagnostic
          path: app/output/kids-sneak-diagnostic
          retention-days: 7
          if-no-files-found: warn
