name: Kids Entry Source Check
on:
  push:
    branches: [codex/kids-entry-preparation-2026-10-18]
permissions:
  contents: write
concurrency:
  group: kids-entry-reviewed-transfer
  cancel-in-progress: false
jobs:
  apply-reviewed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact hash-verified application source on the feature branch
        run: |
          test "$GITHUB_REF" = 'refs/heads/codex/kids-entry-preparation-2026-10-18'
          test -f .github/kids-entry-apply.py || exit 0
          python .github/kids-entry-apply.py
          git diff --check
          git rm .github/kids-entry-apply.py .github/kids-entry-transfer/*.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src app/scripts docs
          git commit -m 'fix(kids): prepare narration only after explicit parent handover'
          git push origin HEAD:refs/heads/codex/kids-entry-preparation-2026-10-18
