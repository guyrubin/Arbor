name: Kids integrity inspection
on:
  push:
    branches: [codex/kids-book-integrity-2026-10-18]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact reviewed book patch
        run: |
          mkdir -p /tmp/kids-book-files /tmp/kids-book-evidence
          sed 's/^ diff --git/diff --git/' .github/kids-integrity.patch > /tmp/kids-book-evidence/applied.patch
          git apply --check /tmp/kids-book-evidence/applied.patch
          git apply /tmp/kids-book-evidence/applied.patch
          git add -N app/src/lib/library/bookSheetAnchor.test.ts
          git diff --check
          git diff --stat
          git diff > /tmp/kids-book-evidence/book-integrity.patch
          for f in app/src/lib/library/bookSheet.ts app/src/lib/library/bookSheetAnchor.test.ts app/src/server/bookSheet.ts app/src/server/bookSheet.test.ts; do
            mkdir -p "/tmp/kids-book-files/$(dirname "$f")"
            cp "$f" "/tmp/kids-book-files/$f"
            git hash-object "$f"
          done
      - name: Validate actual dependency installation and affected book paths
        working-directory: app
        run: |
          npm ci --ignore-scripts
          npm run lint
          npx --no-install vitest run --config scripts/vitest.config.mjs src/lib/library/bookSheetAnchor.test.ts src/server/bookSheet.test.ts src/components/kidmode/hero/heroKeyerBook.test.ts src/components/kidmode/hero/bookSheetMockPipeline.test.ts src/components/kidmode/hero/buildBookSheet.test.ts src/server/bookAssets.test.ts src/server/bookAssetExport.test.ts 2>&1 | tee /tmp/kids-book-evidence/focused-tests.log
          npm audit --json > /tmp/kids-book-evidence/audit-all.json || true
          npm audit --omit=dev --json > /tmp/kids-book-evidence/audit-runtime.json || true
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          for(const scope of ['all','runtime']) {
            const x=JSON.parse(fs.readFileSync(`/tmp/kids-book-evidence/audit-${scope}.json`,'utf8'));
            if(x.error || !x.metadata?.vulnerabilities) throw new Error('Audit unavailable');
            if(x.metadata.vulnerabilities.critical) throw new Error('Critical advisory remains');
            console.log(scope,JSON.stringify(x.metadata.vulnerabilities));
          }
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: kids-reviewed-book-files
          path: /tmp/kids-book-files/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kids-reviewed-book-evidence
          path: /tmp/kids-book-evidence/
          retention-days: 7
  commit-branch-only:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/kids-book-integrity-2026-10-18
      - uses: actions/download-artifact@v4
        with:
          name: kids-reviewed-book-files
          path: /tmp/kids-book-files
      - name: Commit only the four validated book files to this branch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for f in app/src/lib/library/bookSheet.ts app/src/lib/library/bookSheetAnchor.test.ts app/src/server/bookSheet.ts app/src/server/bookSheet.test.ts; do
            cp "/tmp/kids-book-files/$f" "$f"
            git add -- "$f"
          done
          git rm -- .github/kids-integrity.patch
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden book sprite geometry and fail closed on unreadable approved-sheet records (B-BOOK-69)'
          git push origin HEAD:refs/heads/codex/kids-book-integrity-2026-10-18
          git rev-parse HEAD
