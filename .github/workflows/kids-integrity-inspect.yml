name: Kids integrity inspection
on:
  push:
    branches: [codex/kids-book-integrity-2026-10-18]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve compatible security patches without package scripts
        working-directory: app
        run: |
          mkdir -p /tmp/kids-patches /tmp/kids-audit
          npm audit --json > /tmp/kids-audit/before-all.json || true
          npm audit --omit=dev --json > /tmp/kids-audit/before-runtime.json || true
          npx --yes npm@11 --version > /tmp/kids-audit/resolver-version.txt
          npx --yes npm@11 install --package-lock-only --ignore-scripts --save-dev @capacitor/android@8.4.3 @capacitor/ios@8.4.3 @capacitor/cli@8.4.3
          npx --yes npm@11 install --package-lock-only --ignore-scripts @capacitor/core@8.4.3
          # Only advisory-affected packages, within existing semver constraints.
          # No forced upgrades, SDK downgrade, peer bypass or overrides.
          npx --yes npm@11 update --package-lock-only --ignore-scripts proxy-addr tar websocket-driver @babel/core @fastify/busboy @google-cloud/storage @vitest/coverage-v8 @vitest/mocker @xmldom/xmldom baseline-browser-mapping body-parser brace-expansion browserslist express form-data gaxios ip-address nanoid postcss protobufjs qs source-map-js vite vitest tsx 2>&1 | tee /tmp/kids-audit/fix.txt
          npm audit --json > /tmp/kids-audit/after-all.json || true
          npm audit --omit=dev --json > /tmp/kids-audit/after-runtime.json || true
          git diff -- package.json package-lock.json > /tmp/kids-audit/dependency-upgrade.patch
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          for (const stage of ['before', 'after']) for (const scope of ['all', 'runtime']) {
            const report = JSON.parse(fs.readFileSync(`/tmp/kids-audit/${stage}-${scope}.json`, 'utf8'));
            if (report.error || !report.metadata?.vulnerabilities) throw new Error(`Audit unavailable: ${stage}-${scope}`);
            console.log(stage, scope, JSON.stringify(report.metadata.vulnerabilities));
            if (stage === 'after' && report.metadata.vulnerabilities.critical) throw new Error('Critical advisory remains; do not commit');
          }
          const before = JSON.parse((await import('node:child_process')).execFileSync('git', ['show', 'HEAD:app/package.json'], {encoding:'utf8'}));
          const after = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const name of ['firebase', 'firebase-admin', '@google/genai', '@google-cloud/vertexai']) {
            if (before.dependencies[name] !== after.dependencies[name]) throw new Error(`Unexpected SDK manifest change: ${name}`);
          }
          if (after.overrides) throw new Error('Dependency overrides not allowed in this batch');
          JS
          cp package.json package-lock.json /tmp/kids-patches/
      - name: Retain exact dependency files
        uses: actions/upload-artifact@v4
        with:
          name: kids-compatible-dependency-files
          path: /tmp/kids-patches/
          retention-days: 7
      - name: Verify npm 10 clean install and retain local validation toolchain
        working-directory: app
        run: |
          npm ci --ignore-scripts
          tar -czf /tmp/kids-audit/toolchain.tgz node_modules
      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-compatible-dependency-evidence
          path: /tmp/kids-audit/
          retention-days: 7
  commit-branch-only:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/kids-book-integrity-2026-10-18
      - uses: actions/download-artifact@v4
        with:
          name: kids-compatible-dependency-files
          path: /tmp/kids-patches
      - name: Commit package files to this branch only
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cp /tmp/kids-patches/package.json /tmp/kids-patches/package-lock.json app/
          git add -- app/package.json app/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix compatible dependency advisories; align Capacitor 8.4.3 security floor'
          git push origin HEAD:refs/heads/codex/kids-book-integrity-2026-10-18
          git rev-parse HEAD
