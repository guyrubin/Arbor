name: Recover Kids evidence 76867932
# One-time, read-only recovery of this synthetic review artifact. The original
# 631 MB archive exceeds the review connector's 512 MB download limit.
# It executes no artifact content and changes no source or production state.
on:
  push:
    branches: ['codex/kids-production-value-2026-11-19']
    paths: ['.github/workflows/arbor-kids-evidence-recovery.yml']
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kids-performance-evidence
          run-id: 44435274892
          github-token: ${{ github.token }}
          path: evidence
      - name: Retain all original structured evidence
        uses: actions/upload-artifact@v4
        with:
          name: prior-kids-records-76867932
          path: evidence/**/*.json
          retention-days: 7
      - name: Retain story covers and reported ending layouts
        uses: actions/upload-artifact@v4
        with:
          name: prior-story-layouts-76867932
          path: |
            evidence/story-catalogue/*/cover.png
            evidence/story-catalogue/*/failure.png
            evidence/story-catalogue/*/*ending.png
          retention-days: 7
      - name: Retain canonical English page images
        uses: actions/upload-artifact@v4
        with:
          name: prior-canonical-en-76867932
          path: evidence/story-catalogue/book-five-smooth-stones-*-en*/**
          retention-days: 7
      - name: Retain canonical Hebrew page images
        uses: actions/upload-artifact@v4
        with:
          name: prior-canonical-he-76867932
          path: evidence/story-catalogue/book-five-smooth-stones-*-he*/**
          retention-days: 7
      - name: Retain other complete flow evidence
        uses: actions/upload-artifact@v4
        with:
          name: prior-kids-core-76867932
          path: |
            evidence
            !evidence/story-catalogue/**
          retention-days: 7

