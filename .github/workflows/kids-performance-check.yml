name: Kids Performance Check
on:
  push:
    branches: [codex/kids-performance-2026-10-17]
permissions:
  contents: read
concurrency:
  group: kids-performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export complete tracked build fixtures
        run: git archive HEAD | gzip > /tmp/arbor-build-fixtures.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: arbor-build-fixtures
          path: /tmp/arbor-build-fixtures.tgz
          retention-days: 1
