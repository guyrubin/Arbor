name: Kids Performance Check
on:
  push:
    branches: [codex/kids-performance-2026-10-17]
permissions:
  contents: read
concurrency:
  group: kids-performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Export toolchain for isolated regression checks
        run: tar -czf /tmp/arbor-toolchain.tgz app/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: arbor-toolchain
          path: /tmp/arbor-toolchain.tgz
          retention-days: 1
