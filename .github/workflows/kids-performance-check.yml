name: Kids Performance Check
on:
  push:
    branches: [codex/kids-performance-2026-10-17]
permissions:
  contents: write
concurrency:
  group: kids-performance-apply
  cancel-in-progress: false
jobs:
  apply-reviewed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact hash-verified implementation on the feature branch
        run: |
          test "$GITHUB_REF" = 'refs/heads/codex/kids-performance-2026-10-17'
          test -f .github/kids-performance-apply.py || exit 0
          python .github/kids-performance-apply.py
          git diff --check
          git rm .github/kids-performance-apply.py .github/kids-performance-transfer/*.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app docs
          git commit -m 'perf(kids): targeted loading, shared hero reads, audio-clock phrases and safe updates'
          git push origin HEAD:refs/heads/codex/kids-performance-2026-10-17
