# Production deploy for the Arbor API (Cloud Run) via Cloud Build.
#
# Usage:
#   gcloud builds submit --config cloudbuild.prod.yaml \
#     --substitutions=_REGION=europe-west4,_TAG=<short-sha>,_REVISION=<full-commit-sha> \
#     --project <PROD_PROJECT_ID>
#
# Notes:
# - env.ts enforces prod invariants: MODEL_PROVIDER=vertex, MEMORY_ADAPTER=firestore,
#   ENABLE_LOCAL_MEMORY_ADAPTER=false, and BOTH GCP_PROJECT_ID and FIREBASE_PROJECT_ID
#   must be set or the server refuses to boot. The stage cloudbuild.yaml omits the
#   two project ids; this prod config sets them from $PROJECT_ID.
# - FIREBASE_STORAGE_BUCKET = <project>-child-assets: the per-child book assets (B-BOOK-36) live
#   there; without it env.ts falls back to <project>.firebasestorage.app, which does not exist,
#   and every book asset 404s. --set-env-vars REPLACES the list, so it must be set here.
# - REQUIRE_AUTH=true makes /api routes verify Firebase ID tokens. On Cloud Run the
#   Admin SDK uses the service account's Application Default Credentials, so no
#   FIREBASE_CLIENT_EMAIL / FIREBASE_PRIVATE_KEY secrets are required.
# - The browser client is served by Firebase Hosting (see firebase.json), not this
#   image. Build + deploy hosting separately with the VITE_FIREBASE_* build env set
#   (see docs/deployment-production.md).
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - app/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/arbor/arbor-api:${_TAG}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/arbor/arbor-api:${_TAG}
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - arbor-api
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/arbor/arbor-api:${_TAG}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      # OPS-A3 (REL-ARBOR-001): deploy a 0%-traffic CANDIDATE revision tagged
      # `candidate` — no blind 100% cutover. The gated `promote` job in
      # arbor-deploy.yml shifts traffic to it only AFTER the post-deploy smoke passes.
      - --no-traffic
      - --tag
      - candidate
      - --set-env-vars
      # `^|^` switches the gcloud delimiter to | so CORS_ORIGINS can hold a
      # comma-separated origin list AND comp-email vars (ARBOR_*_EMAILS) can
      # contain '@'. (A '@' delimiter would split email addresses.)
      # ARBOR_FAMILY_EMAILS / ARBOR_ADMIN_EMAILS = comped founder/example accounts
      # (full Family + founder dashboard, no billing). Add more, comma-separated.
      # RECONCILE: keep LIVE main's prod env block (production-domain CORS +
      # APP_URL on arborparentingapp.com, IMAGE_GEN_*_DAILY_LIMIT cost guards —
      # all currently live) AND add the caps branch's AI-Studio image-gen secret
      # below. Both are required: the domain cutover is live and must not regress
      # to $PROJECT_ID.web.app, and the prod image-gen fix needs GEMINI_API_KEY.
      # GG-1 (GD-3 unlock): LIVE_ENABLED=true — the Live turn-guard safety spine
      # (screen-before-render, /api/live/turn logging, fail-closed) shipped in
      # PR #83 and activates with this flag. If Gemini Live isn't provisioned on
      # the key yet, /api/live/availability stays false and the client keeps the
      # fallback loop — flipping early is safe by construction.
      # G-V1 (Guy, 8 Oct 2026: "the entire production is a pilot environment
      # addressed to the Israeli market first, so this restriction is not
      # relevant"): the global-Live residency exception runs to Gate A,
      # LIVE_GLOBAL_EXCEPTION_UNTIL=2027-03-31 (code default was 2026-10-31).
      # It lives here because --set-env-vars replaces the whole list on every
      # deploy. After the date production falls back to the EU voice loop; the
      # in-app data-use line names the date from /live/availability.
      # GG-2: TTS_PROVIDER=google — neural Cloud TTS via ADC; client probes the
      # server (the old VITE_TTS_PROVIDER build flag was removed in AI-V4), so
      # this single server var is the whole flip. If the Text-to-Speech API is
      # not enabled on the project, the client falls back to browser voice.
      # CHILD_ASR_PROVIDER=none (ratified 2026-08-27): Sound Lab scores speech
      # on-device via Web Speech. It read `gemini` here, which sent child voice
      # snippets to Google — past the standing child-ASR vendor gate and past the
      # store privacy declarations. Any cloud provider goes back through that gate
      # (vendor + DPA + consent + clinical) AND updates both stores' data forms.
      # B-GA-27 (9 Oct 2026): Google retires gemini-2.5-flash on Vertex on 20 Oct
      # 2026. Text routes move to gemini-3.5-flash (GA, retires no earlier than
      # 19 May 2027) in europe-west3, VERTEX_LOCATION=europe-west3: gemini-3.5-flash
      # is not served in europe-west4; the `eu` multi-region answered 5 of 25 calls
      # in more than 15 s (504s on live routes), europe-west3 none after the cold
      # first call; the global endpoint would break EU residency (GA DoD 6). If
      # europe-west3 saturates (429), VERTEX_LOCATION=eu works with no code change.
      # Images keep GCP_REGION=europe-west4 first (VERTEX_IMAGE_REGIONS); Live is
      # unchanged. Pinned in evals/pinned-models.json `production` (guarded by
      # app/src/eval/acceptance.test.ts).
      # GG-3 (NOT flipped): to move coach chat to Anthropic on Vertex, change
      # VERTEX_MODEL_CHAT=gemini-3.5-flash to VERTEX_MODEL_CHAT=claude-sonnet-5@anthropic
      # ONLY after enabling the Anthropic publisher in the GCP project (Model Garden).
      - ^|^ARBOR_ENV=prod|GITHUB_SHA=${_REVISION}|MODEL_PROVIDER=vertex|MEMORY_ADAPTER=firestore|ENABLE_LOCAL_MEMORY_ADAPTER=false|ENABLE_HIGH_RISK_REVIEW_QUEUE=true|REQUIRE_AUTH=true|ENFORCE_ENTITLEMENTS=true|ARBOR_FAMILY_EMAILS=bguy.rubin@gmail.com|ARBOR_ADMIN_EMAILS=bguy.rubin@gmail.com|FREE_COACH_MESSAGES_PER_DAY=10|GCP_PROJECT_ID=$PROJECT_ID|FIREBASE_PROJECT_ID=$PROJECT_ID|FIREBASE_STORAGE_BUCKET=$PROJECT_ID-child-assets|GCP_REGION=${_REGION}|VERTEX_LOCATION=europe-west3|VERTEX_MODEL_CHAT=gemini-3.5-flash|VERTEX_MODEL_IMAGE=gemini-2.5-flash-image|VERTEX_IMAGE_REGIONS=europe-west4,europe-west1,europe-west3|CHILD_ASR_PROVIDER=none|MAX_OUTPUT_TOKENS=8192|MEMORY_PROMPT_MAX_FACTS=40|IMAGE_GEN_GLOBAL_DAILY_LIMIT=300|LIVE_ENABLED=true|LIVE_MODEL=gemini-3.8-live|LIVE_GLOBAL_EXCEPTION_UNTIL=2027-03-31|TTS_PROVIDER=google|CORS_ORIGINS=https://$PROJECT_ID.web.app,https://$PROJECT_ID.firebaseapp.com,https://arborparentingapp.com,https://www.arborparentingapp.com|APP_URL=https://arborparentingapp.com
      # Parent Live uses short-lived tokens minted with the Gemini API key.
      # Images stay on the configured regional Vertex provider.
      # REVENUECAT_WEBHOOK_AUTH = the shared secret the RC billing webhook sends;
      # MUST stay listed here or a CI deploy drops it and entitlements stop updating.
      - --set-secrets
      - GEMINI_API_KEY=arbor-gemini-key:latest,REVENUECAT_WEBHOOK_AUTH=arbor-rc-webhook-auth:latest
substitutions:
  _REGION: europe-west4
  # _TAG is supplied at submit time (git short SHA). Defaults to "latest" so the
  # config is valid for manual `gcloud builds submit` runs where $SHORT_SHA is unset.
  _TAG: latest
  # _REVISION has no default: every production submission must supply its full
  # commit identity, or Cloud Build rejects the unresolved substitution.
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/arbor/arbor-api:${_TAG}
