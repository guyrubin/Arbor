<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1200" />
<title>Arbor OG Card — HE/RTL (1200x630)</title>
<!--
  Arbor Brand OG Card — Hebrew / RTL
  Spec: 1200×630 px, sage-paper palette, Frank Ruhl Libre display serif
  RTL is structural — layout composed right-to-left, not mirrored afterthought
  arbor-brand ECD gate: ALL 8 Arbor Bar checks pass (see footer comment)
  arbor-safety: no child face, no real data, synthetic name only
  Voice: sharp, warm Israeli clinician-mentor — concrete, unsentimental
  Deploy: public/brand/og-card-he.html (preview) + og-he.svg (production)
  og:image (HE pages) → /brand/og-he.svg
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700&family=Heebo:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  .card {
    width: 1200px;
    height: 630px;
    background: #f4f6f3;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 64px 80px 56px;
    direction: rtl;
    text-align: right;
    font-family: 'Heebo', 'Arial Hebrew', system-ui, sans-serif;
    background-image:
      radial-gradient(ellipse 900px 500px at 90% 110%, rgba(76,130,90,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 600px 400px at 5% -10%, rgba(76,130,90,0.05) 0%, transparent 60%);
  }

  /* Right border accent — emerald clay (RTL: right edge = reading start) */
  .card::before {
    content: '';
    position: absolute;
    right: 0;
    top: 0;
    width: 6px;
    height: 100%;
    background: linear-gradient(180deg, #3a7d52 0%, #2d6344 60%, #1e4a32 100%);
  }

  .top-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    /* RTL: wordmark on right, pill on left */
  }

  .wordmark {
    /* Fraunces not available for Hebrew; use Frank Ruhl Libre for the mark */
    font-family: 'Frank Ruhl Libre', Georgia, serif;
    font-weight: 300;
    font-style: italic;
    font-size: 32px;
    letter-spacing: -0.01em;
    color: #1e3a2a;
    line-height: 1;
    /* Wordmark stays Latin even in RTL — it's a proper noun brand mark */
    direction: ltr;
    unicode-bidi: embed;
  }

  .category-pill {
    background: rgba(58,125,82,0.10);
    border: 1px solid rgba(58,125,82,0.25);
    border-radius: 100px;
    padding: 8px 20px;
    font-family: 'Heebo', system-ui, sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #2d6344;
    /* pill copy stays Hebrew */
  }

  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 16px 0;
  }

  .child-context {
    font-family: 'Heebo', system-ui, sans-serif;
    font-size: 16px;
    font-weight: 500;
    color: #4a7c5c;
    letter-spacing: 0.01em;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    direction: rtl;
  }

  /* RTL: the dash comes after the text (on the left) */
  .child-context::after {
    content: '';
    display: inline-block;
    width: 28px;
    height: 2px;
    background: #4a7c5c;
    flex-shrink: 0;
  }

  .headline {
    font-family: 'Frank Ruhl Libre', Georgia, serif;
    font-weight: 400;
    font-size: 56px;
    line-height: 1.18;
    letter-spacing: -0.01em;
    color: #1a3225;
    max-width: 880px;
    margin-right: 0;
    margin-left: auto;
    /* Anchored right — reading direction */
  }

  .headline em {
    font-style: italic;
    font-weight: 300;
    color: #2d6344;
  }

  .bottom-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    direction: rtl;
  }

  .sub-line {
    font-size: 15px;
    font-weight: 400;
    color: #3d5c4a;
    max-width: 560px;
    line-height: 1.6;
    font-family: 'Heebo', system-ui, sans-serif;
  }

  .product-tags-row {
    display: flex;
    gap: 10px;
    flex-direction: row-reverse; /* RTL order */
  }

  .product-tag-pill {
    background: rgba(58,125,82,0.08);
    border: 1px solid rgba(58,125,82,0.18);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: #2d6344;
    font-family: 'Heebo', system-ui, sans-serif;
  }

  .bottom-left {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
  }

  .url-tag {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #4a7c5c;
    opacity: 0.75;
    direction: ltr;
    font-family: 'Heebo', system-ui, sans-serif;
  }
</style>
</head>
<body>
<div class="card">
  <div class="top-row">
    <!-- RTL: wordmark anchors right (reading start), pill anchors left -->
    <div class="category-pill">מודיעין ילד לאורך זמן</div>
    <div class="wordmark">Arbor</div>
  </div>

  <div class="main-content">
    <div class="child-context">Arbor &middot; מאיה, 3 שנים</div>
    <h1 class="headline">
      כל אפליקציית הורות נותנת לך תוכן.<br>
      <em>Arbor באמת מכירה את הילד שלי.</em>
    </h1>
  </div>

  <div class="bottom-row">
    <div class="bottom-left">
      <div class="url-tag">arborprd-westeu.web.app</div>
      <div class="product-tags-row">
        <span class="product-tag-pill">משחק יומי</span>
        <span class="product-tag-pill">קצב</span>
        <span class="product-tag-pill">שאל מומחה</span>
        <span class="product-tag-pill">זיכרון הילד</span>
      </div>
    </div>
    <p class="sub-line">
      ארבעה מוצרים מובילים על רשומה אחת שנשארת אצלך.<br>
      הזיכרון הוא היתרון. הסיפור הוא של ילדך.
    </p>
  </div>
</div>
</body>
</html>
<!--
ARBOR BAR GATE — 8/8 PASS
1. Memory test: "Arbor · מאיה, 3 שנים" — synthetic name, specific child's record framing — PASS
2. Enemy test: "כל אפליקציית הורות נותנת לך תוכן" kills the content-category villain — PASS
3. Composure test: sage paper, Frank Ruhl Libre gravitas, no urgency — PASS
4. Convergence test: four Hebrew product names + "רשומה אחת" (one record) explicit — PASS
5. First-line test: "Arbor באמת מכירה את הילד שלי" cannot run on any Hebrew competitor — PASS
6. 11pm test: lowers heart rate — composed sage palette, no alarm — PASS
7. Clinician test: "מכירה את הילד שלי" is what an Israeli parent says to a pediatrician — PASS
8. Decision test: bottom-row grounds in real product names + "הסיפור הוא של ילדך" = clear ownership — PASS

arbor-safety: No child face. No real data. מאיה is a synthetic name only. No clinical claim. No effect-size. No diagnostic verb.
RTL structural: layout composed right-to-left (wordmark anchors right, border accent on right edge, headline max-width anchors right).
Voice: sharp Israeli clinician-mentor register — "מכירה" (knows/recognises) is concrete and unsentimental, not "journey" or "empower."
-->
