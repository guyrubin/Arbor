<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Pre-hydration locale: set <html lang/dir> BEFORE the bundle loads so an
      // Israeli parent on a Hebrew browser never sees an English/LTR flash, and
      // RTL font stacks apply from first paint. Mirrors LanguageContext — a
      // stored choice (arbor.uiLang) always wins; otherwise the browser locale
      // is honored (he / legacy "iw" → Hebrew + RTL, en → English, else English).
      // React re-reads and keeps this in sync after mount.
      (function () {
        try {
          var html = document.documentElement;
          var stored = localStorage.getItem('arbor.uiLang');
          var lang = 'en';
          if (stored === 'he' || stored === 'en') {
            lang = stored;
          } else {
            var tags = (navigator.languages && navigator.languages.length)
              ? navigator.languages : [navigator.language];
            for (var i = 0; i < tags.length; i++) {
              var base = (tags[i] || '').toLowerCase().split('-')[0];
              if (base === 'he' || base === 'iw') { lang = 'he'; break; }
              if (base === 'en') { break; }
            }
          }
          html.lang = lang;
          html.dir = lang === 'he' ? 'rtl' : 'ltr';
        } catch (e) { /* bundle sets defaults on mount */ }
      })();
    </script>
    <meta name="description" content="Arbor — your child's development, thoughtfully guided." />
    <meta name="theme-color" content="#fbfaf7" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Arbor" />
    <title>Arbor — Parent Development Support</title>

    <!-- preconnect for the TEXT webfonts still imported by src/index.css
         (Fraunces / Nunito / Heebo / …, all font-display:swap with real local
         fallbacks). The ICON font is self-hosted below — see next block. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- UC-2 visual-match: Material Symbols Rounded icon font (parent surfaces).
         Variable axes (opsz,wght,FILL,GRAD) match the .design-source mock; the
         .msr base class below sets the default variation; per-instance overrides
         come from the shared <Icon> component (src/components/ui/Icon.tsx).

         SELF-HOSTED, deliberately. This used to be a <link> to
         fonts.googleapis.com, which made the app's ENTIRE iconography a hard
         third-party network dependency — in a PWA that is otherwise offline
         capable (Firestore persistence + the app-shell service worker), and
         whose icons are *ligatures*: when the font did not arrive, the sidebar
         and topbar rendered the literal words "home / monitoring / eco /
         edit_note / expand_more". The unsubsetted Google request also shipped
         the full 5.3 MB variable font.

         Now: a ~283 KB subset in /fonts (only the ligatures src/ can reference),
         precached by public/sw.js, regenerated by scripts/build-icon-font.mjs,
         Apache-2.0 notice in /fonts/LICENSE.txt. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/material-symbols-rounded-subset.woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'Material Symbols Rounded';
        font-style: normal;
        font-weight: 100 700;
        src: url('/fonts/material-symbols-rounded-subset.woff2') format('woff2');
        /* block — never `swap`: a swap period paints the ligature TEXT in a
           fallback face, which is exactly the failure being designed out. */
        font-display: block;
      }
      .msr {
        font-family: 'Material Symbols Rounded';
        font-weight: normal;
        font-style: normal;
        line-height: 1;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        vertical-align: middle;
        font-variation-settings: 'opsz' 24, 'wght' 500, 'GRAD' 0, 'FILL' 0;
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        /* An .msr nested in uppercase-styled chrome (text-transform +
           tracking) mangles the ligature name ("child_care" → "CHILD_CARE" /
           "C H I L D…"), which matches NO ligature — so the English word
           paints even with the font loaded. Neutralize inherited text
           styling here; an icon is never selectable text either. */
        text-transform: none;
        letter-spacing: normal;
        -webkit-user-select: none;
        user-select: none;
        /* Terminal safety net. font-display:block still gives up after ~3s and
           falls back — and any fallback face renders the ligature as English.
           Glyphs stay hidden (layout box preserved, so nothing shifts) until
           the icon font is confirmed loaded by the gate below; if it never
           loads, a parent sees blank icon slots next to real labels rather
           than "expand_more" spelled out in their UI. */
        visibility: hidden;
      }
      html.msr-ready .msr {
        visibility: visible;
      }
      /* While unresolved, hold the slot at the glyph's own advance width (1em)
         instead of the fallback face's text width — otherwise the hidden word
         "monitoring" still reserves ~98px and pushes the layout around. */
      html:not(.msr-ready) .msr {
        inline-size: 1em;
        overflow: hidden;
      }
    </style>
    <script>
      // Icon-font readiness gate (see .msr above). Reveals glyphs ONLY once
      // the face is confirmed usable — there is no reveal path without that
      // confirmation. No timeout-based reveal, no reveal when the Font Loading
      // API is missing or throws: any unconfirmed reveal re-introduces the
      // raw-ligature-text failure this gate exists to prevent (blank slots
      // beat English words).
      (function () {
        var html = document.documentElement;
        function reveal() { html.classList.add('msr-ready'); }
        try {
          if (!document.fonts || !document.fonts.load) { return; }
          document.fonts
            .load("24px 'Material Symbols Rounded'", 'home')
            .then(function (faces) { if (faces && faces.length) reveal(); })
            .catch(function () { /* blank slots beat English words */ });
        } catch (e) { /* same doctrine: never reveal without the font */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
